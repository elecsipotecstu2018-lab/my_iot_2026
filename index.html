<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART HOME - IoT Control Panel</title>
    <!-- โหลด Font Awesome สำหรับแสดงไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ตั้งค่ารูปแบบพื้นฐานและสีพื้นหลัง (Dark Theme) */
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* กล่องควบคุมหลัก (Card) */
        .control-panel {
            background-color: #161b22;
            border-radius: 20px;
            padding: 30px;
            width: 350px;
            box-shadow: 0 8px 32px rgba(0, 255, 255, 0.1);
            border: 1px solid #30363d;
        }

        /* หัวข้อ */
        h1 {
            text-align: center;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            margin-bottom: 5px;
            font-size: 24px;
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            color: #8b949e;
            font-size: 12px;
            margin-bottom: 30px;
        }

        /* รายการแต่ละช่อง (Channel Row) */
        .channel-row {
            background-color: #21262d;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #30363d;
        }

        .channel-info {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 16px;
        }

        .channel-info i {
            color: #00ffff;
            width: 20px;
            text-align: center;
        }

        /* การออกแบบ Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #484f58;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        /* เมื่อสวิตช์ถูกเปิด (Checked) */
        input:checked + .slider {
            background-color: #00ffff;
            box-shadow: 0 0 10px #00ffff;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <h1>SMART HOME</h1>
        <div class="subtitle">ESP8266 IoT Control Panel</div>

        <!-- ช่องที่ 1 (D1) -->
        <div class="channel-row">
            <div class="channel-info">
                <i class="fa-solid fa-lightbulb"></i>
                <span>ช่องที่ 1 (D1)</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="ch1" onchange="toggleDevice('ch1')">
                <span class="slider"></span>
            </label>
        </div>

        <!-- ช่องที่ 2 (D2) -->
        <div class="channel-row">
            <div class="channel-info">
                <i class="fa-solid fa-plug"></i>
                <span>ช่องที่ 2 (D2)</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="ch2" onchange="toggleDevice('ch2')">
                <span class="slider"></span>
            </label>
        </div>

        <!-- ช่องที่ 3 (D5) -->
        <div class="channel-row">
            <div class="channel-info">
                <i class="fa-solid fa-tv"></i>
                <span>ช่องที่ 3 (D5)</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="ch3" onchange="toggleDevice('ch3')">
                <span class="slider"></span>
            </label>
        </div>

        <!-- ช่องที่ 4 (D6) -->
        <div class="channel-row">
            <div class="channel-info">
                <i class="fa-solid fa-snowflake"></i>
                <span>ช่องที่ 4 (D6)</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="ch4" onchange="toggleDevice('ch4')">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- นำเข้า Firebase SDK (เวอร์ชัน 10 แบบ Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // ==========================================
        // ตั้งค่าคอนฟิก Firebase ของคุณที่นี่ (นำมาจาก Firebase Console)
        // ==========================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // เริ่มต้นการทำงานของ Firebase และ Database
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // รายชื่ออุปกรณ์ (อ้างอิงกับ ID ของ Checkbox และ Key ใน Database)
        const devices = ['ch1', 'ch2', 'ch3', 'ch4'];

        // ฟังก์ชันอ่านค่าจาก Firebase แบบ Real-time ทันทีที่โหลดหน้าเว็บหรือมีคนอื่นกด
        devices.forEach(device => {
            const deviceRef = ref(db, 'devices/' + device);
            onValue(deviceRef, (snapshot) => {
                const data = snapshot.val();
                if (data !== null) {
                    // ปรับสถานะสวิตช์หน้าเว็บให้ตรงกับในฐานข้อมูล
                    document.getElementById(device).checked = data;
                }
            });
        });

        // ฟังก์ชันส่งค่าขึ้น Firebase เมื่อเรากดคลิกที่สวิตช์บนหน้าเว็บ
        // เราเปิดให้ฟังก์ชันนี้เข้าถึงได้จากภายนอก (Global Scope) เพราะเราใช้ใน attribute 'onchange'
        window.toggleDevice = function(deviceId) {
            const isChecked = document.getElementById(deviceId).checked;
            const deviceRef = ref(db, 'devices/' + deviceId);
            
            // สั่งอัปเดตค่าลง Firebase
            set(deviceRef, isChecked)
                .then(() => {
                    console.log(`${deviceId} อัปเดตเป็น ${isChecked}`);
                })
                .catch((error) => {
                    console.error("เกิดข้อผิดพลาดในการอัปเดตข้อมูล:", error);
                    // หากขัดข้อง ให้คืนค่าสวิตช์กลับ
                    document.getElementById(deviceId).checked = !isChecked;
                });
        };
    </script>
</body>
</html>
